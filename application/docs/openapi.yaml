openapi: 3.0.1


info:
  title: Programmer Notebook
  version: 1.0.0


servers:
  - url: https://0.0.0.0:8080/api/v2


tags:
  - name: auth
  - name: users
  - name: teams
  - name: notes
  - name: collections
  - name: sections


paths:
  #####################################################################
  # Authentithication API
  #####################################################################

  /registration:
    post:
      tags:
        - auth
      summary: Create user
      operationId: registerUser

      requestBody:
        description: Информация о новом пользователе для регистрации
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/UserRegistrationInfo'
        required: true

      responses:
        "200":
          description: User successfully created
        "409":
          description: User alredy exists
        "422":
          description: Invalid parameters
        "500":
          description: Internal error

  /login:
    post:
      tags:
        - auth
      summary: Login
      operationId: signInUser

      requestBody:
        description: Информация о клиенте для входа
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/UserLoginInfo'
        required: true

      responses:
        "200":
          description: User successfully logged in
          content:
            'json':
              schema:
                $ref: '#/components/schemas/Token'
        "401":
          description: Authorization error
        "404":
          description: Not Found
        "500":
          description: Internal error

      #####################################################################
      # User API
      #####################################################################

  /users:
    get:
      tags:
        - users
      summary: Get all users in database
      description: Получение всех зарегестрированных пользователей
      operationId: getAllUsers

      security:
        - JWTAuth: []

      responses:
        "200":
          description: Success
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPublicInfo'
        "403":
          description: Недостаточно прав
        "500":
          description: Internal error

  /users/{id}:
    get:
      tags:
        - users
      summary: Get user
      description: Получение одного пользователя
      operationId: getUser


      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID пользователя
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Success
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserFullInfo'
        "401":
          description: Authorization error
        "403":
          description: Недостаточно прав
        "404":
          description: No such user
        "500":
          description: Internal error

    delete:
      tags:
        - users
      summary: Delete user
      description: Удаление одного пользователя
      operationId: deleteUser

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID пользователя
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Success
        "401":
          description: Authorization error
        "403":
          description: Недостаточно прав
        "404":
          description: Пользователь не найден
        "500":
          description: Внутренняя ошибка сервера

    patch:
      tags:
        - users
      summary: Update user
      description: Изменение данных пользователя
      operationId: updateUser

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: "ID, или логин, или ФИО изменяемого пользователя"
          required: true
          schema:
            type: integer

      requestBody:
        description: Новые данные пользователя
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/UserPrivateInfo'
        required: true

      responses:
        "200":
          description: Success
          content: {}
        "401":
          description: Authorization error
          content: {}
        "403":
          description: Недостаточно прав
          content: {}
        "404":
          description: No such user
          content: {}
        "500":
          description: Internal error
          content: {}

      #####################################################################
      # Team API
      #####################################################################

  /teams:
    get:
      tags:
        - teams
      summary: Get all teams in database
      description: Получение всех команд
      operationId: getAllTeams

      security:
        - JWTAuth: []

      responses:
        "200":
          description: Success
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamInfo'
        "403":
          description: Недостаточно прав
        "500":
          description: Internal error

    post:
      tags:
        - teams
      summary: Add new team
      operationId: addTeam

      security:
        - JWTAuth: []

      requestBody:
        description: Данные команды
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/TeamInfo'
        required: true

      responses:
        "200":
          description: Team successfully created
          content:
            'application/json':
              schema:
                type: object
                properties:
                  teamID:
                    type: integer
        "409":
          description: Team alredy exists
        "422":
          description: Invalid parameters
        "500":
          description: Internal error

  /teams/{id}:
    get:
      tags:
        - teams
      summary: Get team
      description: Получение одной команды
      operationId: getTeam

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID команды
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/TeamFullInfo'
        "401":
          description: Authorization error
        "403":
          description: Недостаточно прав
        "404":
          description: No such user
        "500":
          description: Internal error

    delete:
      tags:
        - teams
      summary: Delete team
      description: Удаление команды
      operationId: deleteTeam

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID команды
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Success
        "401":
          description: Authorization error
        "403":
          description: Недостаточно прав
        "404":
          description: No such command
        "500":
          description: Internal error

    patch:
      tags:
        - teams
      summary: Update team info
      description: Изменение данных команды
      operationId: updateTeam

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID команды
          required: true
          schema:
            type: integer

      requestBody:
        description: Новые данные команды
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/TeamInfo'
        required: true

      responses:
        "200":
          description: Success
        "401":
          description: Authorization error
        "403":
          description: Недостаточно прав
        "404":
          description: No such user
        "500":
          description: Internal error

  /teams/{id}/members:
    get:
      tags:
        - teams
      summary: Get team members
      description: "Получение членов команды или по ID, или по названию команды"
      operationId: getTeamMembers

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID команды
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Success
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPublicInfo'
        "401":
          description: Authorization error
        "403":
          description: Недостаточно прав
        "404":
          description: No such user
        "500":
          description: Internal error

    post:
      tags:
        - teams
      summary: Add user to team
      description: Добавление пользователя в команду
      operationId: addUserToTeam

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID команды, в которую добавляем
          required: true
          schema:
            type: integer

      requestBody:
        description: ID пользователя, которого добавляем
        content:
          'application/json':
            schema:
              type: object
              properties:
                userID:
                  type: integer
        required: true

      responses:
        "200":
          description: Success
        "401":
          description: Authorization error
        "403":
          description: Недостаточно прав
        "404":
          description: No such user
        "500":
          description: Internal error

  /teams/{teamID}/members/{userID}:
    delete:
      tags:
        - teams
      summary: Delete user from team
      description: Удаление пользователя из команды
      operationId: deleteUserFromTeam

      security:
        - JWTAuth: []

      parameters:
        - name: teamID
          in: path
          description: ID команды, из которой удаляем
          required: true
          schema:
            type: integer

        - name: userID
          in: path
          description: ID пользователя, которого удаляем
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Success
        "401":
          description: Authorization error
        "403":
          description: Недостаточно прав
        "404":
          description: No such user
        "500":
          description: Internal error

      #####################################################################
      # Note API
      #####################################################################

  /notes:
    get:
      tags:
        - notes
      summary: Get all notes
      description: Получить все записки.
      operationId: getAllNotes

      security:
        - JWTAuth: []

      parameters:
        - name: type
          in: query
          description: Получаем вообще все или только открытые записки.
          required: true
          schema:
            type: string
            enum:
              - all
              - open

      responses:
        "200":
          description: Успешный ответ с данными записок.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteInfo'
        "500":
          description: Внутренняя ошибка сервера.

    post:
      tags:
        - notes
      summary: Add a new note
      description: Добавить новую записку.
      operationId: addNote

      security:
        - JWTAuth: []

      requestBody:
        description: Данные для добавления записки.
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteFullData'

      responses:
        "200":
          description: Записка успешно добавлена.
          content:
            'application/json':
              schema:
                type: object
                properties:
                  noteID:
                    type: integer
        "400":
          description: Некорректные данные.
        "500":
          description: Внутренняя ошибка сервера.

  /notes/{id}:
    get:
      tags:
        - notes
      summary: Get a note
      description: Получить записку по ID или названию.
      operationId: getNote

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID записки.
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Успешный ответ с данными записки.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/NoteFullData'
        "404":
          description: Записка не найдена.
        "500":
          description: Внутренняя ошибка сервера.

    delete:
      tags:
        - notes
      summary: Delete a note
      description: Удалить записку по ID или названию.
      operationId: deleteNote

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID записки
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Записка успешно удалена.
        "404":
          description: Записка не найдена.
        "500":
          description: Внутренняя ошибка сервера.

    patch:
      tags:
        - notes
      summary: Update a note
      description: Обновить информацию о записке.
      operationId: updateNote

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID записки
          required: true
          schema:
            type: integer

      requestBody:
        description: Обновленные данные записки.
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteFullData'

      responses:
        "200":
          description: Записка успешно обновлена.
        "404":
          description: Записка не найдена.
        "500":
          description: Внутренняя ошибка сервера.

  #####################################################################
  # Collection API
  #####################################################################

  /collections:
    get:
      tags:
        - collections
      summary: Get all collections
      description: Получить список всех коллекций.
      operationId: getAllCollections

      security:
        - JWTAuth: []

      responses:
        "200":
          description: Успешное получение всех коллекций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionInfo'
        "403":
          description: Недостаточно прав
        "500":
          description: Внутренняя ошибка сервера

    post:
      tags:
        - collections
      summary: Add a new collection
      description: Добавить новую коллекцию.
      operationId: addCollection

      security:
        - JWTAuth: []

      requestBody:
        description: Данные для добавления коллекции.
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/CollectionAddInfo'

      responses:
        "200":
          description: Успешное добавление коллекции
          content:
            'application/json':
              schema:
                type: object
                properties:
                  collID:
                    type: integer
        "500":
          description: Внутренняя ошибка сервера

  /collections/users/{id}:
    get:
      tags:
        - collections
      summary: Get all user collections
      description: Получить список всех коллекций конкретного пользователя.
      operationId: getAllUserCollections

      parameters:
        - name: id
          in: path
          description: ID пользователя
          required: true
          schema:
            type: integer

      security:
        - JWTAuth: []

      responses:
        "200":
          description: Успешное получение всех коллекций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionInfo'
        "403":
          description: Недостаточно прав
        "500":
          description: Внутренняя ошибка сервера

  /collections/{id}:
    get:
      tags:
        - collections
      summary: Get collection by ID
      description: Получить информацию о коллекции по ее ID.
      operationId: getCollection

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID коллекции.
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Успешное получение коллекции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionFullInfo'
        "404":
          description: Коллекция не найдена
        "400":
          description: Неверный запрос (например, некорректные параметры)
        "500":
          description: Внутренняя ошибка сервера

    delete:
      tags:
        - collections
      summary: Delete a collection
      description: Удалить коллекцию по ID или по названию.
      operationId: deleteCollection

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID коллекции.
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Успешное удаление коллекции
        "403":
          description: Недостаточно прав
        "404":
          description: Коллекция не найдена
        "500":
          description: Внутренняя ошибка сервера

    patch:
      tags:
        - collections
      summary: Update a collection
      description: Обновление данные коллекции.
      operationId: updateCollection

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID коллекции.
          required: true
          schema:
            type: integer

      requestBody:
        description: Данные для обновления коллекции.
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/CollectionAddInfo'

      responses:
        "200":
          description: Успешное обновление коллекции
        "403":
          description: Недостаточно прав
        "404":
          description: Коллекция не найдена
        "500":
          description: Внутренняя ошибка сервера

  /collection/{id}/notes:
    get:
      tags:
        - collections
      summary: Get all notes in a collection
      description: Получить все записки, относящиеся к указанной коллекции.
      operationId: getAllNotesInCollection

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID коллекции.
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Успешное получение записок из коллекции
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteInfo'
        "403":
          description: Недостаточно прав
        "404":
          description: Коллекция не найдена
        "500":
          description: Внутренняя ошибка сервера

    post:
      tags:
        - collections
      summary: Add a note to a collection
      description: Добавление записки в коллекцию.
      operationId: addNoteToColl

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID коллекции
          required: true
          schema:
            type: integer
            example: 10

      requestBody:
        description: ID записки
        content:
          'application/json':
            schema:
              type: object
              properties:
                noteID:
                  type: integer
        required: true

      responses:
        "200":
          description: Успешное добавление записки в коллекцию
        "403":
          description: Недостаточно прав
        "404":
          description: Коллекция или записка не найдены
        "500":
          description: Внутренняя ошибка сервера

  /collection/{collID}/notes/{noteID}:
    delete:
      tags:
        - collections
      summary: Delete a note from a collection
      description: Удаление записки из коллекции.
      operationId: deleteNoteFromColl

      security:
        - JWTAuth: []

      parameters:
        - name: collID
          in: path
          description: ID коллекции
          required: true
          schema:
            type: integer
            example: 10

        - name: noteID
          in: path
          description: ID записки
          required: true
          schema:
            type: integer
            example: 20

      responses:
        "200":
          description: Успешное удаление записки из коллекции
        "403":
          description: Недостаточно прав
        "404":
          description: Коллекция или записка не найдены
        "500":
          description: Внутренняя ошибка сервера

  #####################################################################
  # Section API
  #####################################################################

  /sections:
    get:
      tags:
        - sections
      summary: Get all sections
      operationId: getAllSections

      security:
        - JWTAuth: []

      responses:
        "200":
          description: Успешное получение всех разделов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SectionInfo'
        "403":
          description: Недостаточно прав
        "500":
          description: Внутренняя ошибка сервера

    post:
      tags:
        - sections
      summary: Add new section
      operationId: addSection

      security:
        - JWTAuth: []

      requestBody:
        description: Данные для добавления раздела.
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/SectionInfo'

      responses:
        "200":
          description: Успешное добавление раздела
          content:
            'application/json':
              schema:
                type: object
                properties:
                  secID:
                    type: integer
        "403":
          description: Недостаточно прав
        "500":
          description: Внутренняя ошибка сервера

  /sections/{id}:
    get:
      tags:
        - sections
      summary: Get section by ID
      description: Получить информацию о разделе по его ID.
      operationId: getSection

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID раздела.
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Успешное получение раздела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionFullInfo'
        "404":
          description: Раздел не найден
        "400":
          description: Неверный запрос (например, некорректные параметры)
        "500":
          description: Внутренняя ошибка сервера

    delete:
      tags:
        - sections
      summary: Delete a section
      description: Удалить раздел по ID.
      operationId: deleteSection

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID раздела.
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Успешное удаление раздела
        "403":
          description: Недостаточно прав
        "404":
          description: Раздел не найден
        "500":
          description: Внутренняя ошибка сервера

  /sections/{id}/notes:
    get:
      tags:
        - sections
      summary: Get all notes in a section
      description: Получить все записки, относящиеся к указанному разделу.
      operationId: getAllNotesInSection

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID раздела.
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Успешное получение записок из раздела
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteInfo'
        "403":
          description: Недостаточно прав
        "404":
          description: Раздел не найден
        "500":
          description: Внутренняя ошибка сервера

    post:
      tags:
        - sections
      summary: Add a note to a section
      description: Добавление записки в раздел.
      operationId: addNoteToSec

      security:
        - JWTAuth: []

      parameters:
        - name: id
          in: path
          description: ID коллекции
          required: true
          schema:
            type: integer
            example: 10

      requestBody:
        description: ID записки
        content:
          'application/json':
            schema:
              type: object
              properties:
                noteID:
                  type: integer
                  description: ID записки
        required: true

      responses:
        "200":
          description: Успешное добавление записки в раздел
        "403":
          description: Недостаточно прав
        "404":
          description: Раздел или записка не найдены
        "500":
          description: Внутренняя ошибка сервера

  /sections/{secID}/notes/{noteID}:
    delete:
      tags:
        - sections
      summary: Delete a note from a section
      description: Удаление записки из раздела.
      operationId: deleteNoteFromSec

      security:
        - JWTAuth: []

      parameters:
        - name: secID
          in: path
          description: ID коллекции
          required: true
          schema:
            type: integer
            example: 10

        - name: noteID
          in: path
          description: ID записки
          required: true
          schema:
            type: integer
            example: 20

      responses:
        "200":
          description: Успешное удаление записки из раздела
        "403":
          description: Недостаточно прав
        "404":
          description: Раздел или записка не найдены
        "500":
          description: Внутренняя ошибка сервера


